name: Build and checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/run.py --prepare
      - run: python3 scripts/ci/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: images-ci-evidence
          path: |
            build/ci/
            build/ci-prepared/
